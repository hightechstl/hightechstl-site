<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
body { font-family: Georgia, serif; margin: 0; background: #f6eedc; color: #2a241d; }
.hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { width: 900px; max-width: 90vw; background: linear-gradient(180deg, #fff8e8 0%, #efe0b5 100%); border: 3px solid #7a5c32; border-radius: 18px; padding: 48px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.kicker { letter-spacing: .2em; text-transform: uppercase; color: #7a5c32; font-size: 14px; }
h1 { font-size: 48px; margin: 12px 0; }
.tag { font-size: 22px; color: #503d2b; margin-bottom: 18px; }
.meta { font-size: 18px; }
</style>
</head>
<body>
<div class="hero">
  <div class="card">
    <div class="kicker">Adventure Nights</div>
    <h1>Lanterns Below Marrow Hill</h1>
    <div class="tag">A one-hour cooperative mystery for exactly two players.</div>
    <p class="meta">Mood: quiet, mysterious, and hopeful. Platform: browser-first, mobile-friendly, printable bonus pack included.</p>
  </div>
</div>
</body>
</html>
